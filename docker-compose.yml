# Domyślnie: docker compose up -d
# Uruchamia API, mailer, Mailpit i Ollamę; model-init kończy się po inicjalizacji.
# Laya jest OPCJONALNA: bez profilu laya jej obrazy nie są budowane ani uruchamiane.
# Wariant Laya: docker compose --env-file .env.laya-example up -d
# Ten plik env włącza profil i kieruje klienta modelu do laya-adapter.
# Samo --profile laya uruchamia kontenery, ale nie zmienia dostawcy modelu.
# Powrót z Laya: najpierw docker compose --env-file .env.laya-example stop laya-adapter laya-runtime,
# następnie docker compose --env-file .env.ollama-example up -d.
# Wyłączenie profilu nie zatrzymuje wcześniej uruchomionych kontenerów.
name: message-router

x-python-health: &python-health
  test:
    [
      "CMD",
      "python",
      "-c",
      "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=8)",
    ]
  interval: 20s
  timeout: 10s
  retries: 3
  start_period: 30s

# Wspólny klient OpenAI-compatible dla Ollamy, OpenRouter i adaptera Laya.
x-model-env: &model-env
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://ollama:11434/v1}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-ollama}
  OPENAI_MODEL: ${OPENAI_MODEL:-gemma4:e2b}
  # auto|required|named; puste pomija pole dla backendów bez jego obsługi.
  MODEL_TOOL_CHOICE: ${MODEL_TOOL_CHOICE-required}
  MODEL_MAX_TOKENS: ${MODEL_MAX_TOKENS:-1024}
  MODEL_TOKEN_LIMIT_FIELD: ${MODEL_TOKEN_LIMIT_FIELD:-max_tokens}
  # Puste wartości pomijają opcję u dostawcy; nie używać tu operatora :-.
  MODEL_REASONING_EFFORT: ${MODEL_REASONING_EFFORT-none}
  MODEL_TEMPERATURE: ${MODEL_TEMPERATURE-0}
  MODEL_TOP_P: ${MODEL_TOP_P-0.8}

services:
  # Publiczne HTTP API i agent LangChain; Swagger pod /api/v1/docs.
  api:
    build: ./services/router
    environment:
      <<: *model-env
      MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-180}
      # Opt-in raw model traces for observed synthetic debugging; includes message content.
      MODEL_TRACE: ${MODEL_TRACE:-false}
      MAILER_BASE_URL: http://mailer:8000
      MAILER_TOKEN: ${MAILER_TOKEN:-local-poc-mailer-token}
      MAILER_TIMEOUT_SECONDS: 40
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      model-init:
        condition: service_completed_successfully
      mailer:
        condition: service_healthy
    networks: [app, inference]
    healthcheck: *python-health
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  # Bariera startowa: zwykłe up -d czeka na zdrowe API, nie tylko start procesu.
  # Kontener jednorazowy; nie wykonuje inferencji ani nie wysyła wiadomości.
  ready:
    image: python:3.12.12-slim-bookworm
    command:
      - python
      - -c
      - "import json, urllib.request; assert json.load(urllib.request.urlopen('http://api:8000/health/ready', timeout=8))['status'] == 'ready'"
    depends_on:
      api:
        condition: service_healthy
    networks: [app]
    restart: "no"
    user: "10001:10001"
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  # Wewnętrzne API wysyłki, własny rejestr SQLite i transport SMTP do Mailpit.
  mailer:
    build: ./services/mailer
    environment:
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_TIMEOUT_SECONDS: 15
      MAIL_FROM: ${MAIL_FROM:-router@example.com}
      MAILER_TOKEN: ${MAILER_TOKEN:-local-poc-mailer-token}
      DATABASE_PATH: /data/deliveries.sqlite3
      ALLOWED_RECIPIENTS: human-resources@example.com,help-desk@example.com,it@example.com,kadry@example.com,other@example.com
    depends_on:
      mailpit:
        condition: service_healthy
    networks: [app, smtp]
    volumes:
      - deliveries:/data
    healthcheck: *python-health
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  # Przechwytuje testowe maile; panel http://localhost:8025. Nie wysyła na zewnątrz.
  mailpit:
    image: axllent/mailpit:v1.29.2
    environment:
      MP_DATABASE: /data/mailpit.db
      # Zachowaj wcześniejszą pocztę podczas kolejnych benchmarków po 500 przypadków.
      MP_MAX_MESSAGES: ${MAILPIT_MAX_MESSAGES:-10000}
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
    volumes:
      - captured-mail:/data
    networks: [smtp, mailpit-ui]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Domyślny lokalny LLM wymagany w zadaniu. Pozostaje uruchomiony także
  # dla Laya/OpenRouter; MODEL_BOOTSTRAP=external pomija pobieranie jego wag.
  ollama:
    # Pinned backend fixes; generic agent and model weights remain unchanged.
    # Native Gemma grammar + narrow delimiter preservation; see README.md#poprawki-backendu-ollama.
    image: wskz-ollama-candidate:0.34.4-poc.tool-choice.2
    build: ./services/ollama-candidate
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: 30m
      OLLAMA_NUM_PARALLEL: 1
    volumes:
      - ollama-models:/root/.ollama
    networks: [inference]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # Jednorazowa inicjalizacja blokująca start API do uzyskania gotowości modelu.
  # ollama: pobranie wag i sonda tool calling; external: sprawdzenie /models.
  model-init:
    build: ./services/model-init
    environment:
      <<: *model-env
      MODEL_BOOTSTRAP: ${MODEL_BOOTSTRAP:-ollama}
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    networks: [inference]
    restart: "no"
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  # OPCJONALNY profil laya: silnik klasyfikatora i cache jego wag.
  # Zwykłe up -d bez aktywnego profilu laya pomija cały ten serwis.
  laya-runtime:
    profiles: [laya]
    build: ./services/laya-runtime
    environment:
      LAYA_THREADS: ${LAYA_THREADS:-4}
      HF_HOME: /models
    volumes:
      - laya-models:/models
    networks: [laya-engine]
    healthcheck:
      <<: *python-health
      start_period: 20m
      start_interval: 5s
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  # OPCJONALNY profil laya: tłumaczy Chat Completions na typowaną decyzję Laya.
  # Nie jest potrzebny przy Ollamie ani OpenRouter.
  laya-adapter:
    profiles: [laya]
    build: ./services/laya-adapter
    environment:
      LAYA_BASE_URL: http://laya-runtime:8000
      LAYA_MODEL: multilingual
      ADAPTER_MODEL: laya-multilingual
      LAYA_TIMEOUT_SECONDS: 150
    depends_on:
      laya-runtime:
        condition: service_healthy
    networks: [inference, laya-engine]
    healthcheck: *python-health
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  # OPCJONALNY profil test: docker compose --profile test run --build --rm tests
  tests:
    profiles: [test]
    build:
      context: .
      dockerfile: tests/Dockerfile
    network_mode: none

  # OPCJONALNY profil test: rzeczywista ścieżka API -> model -> mailer -> Mailpit.
  # Uruchomienie: docker compose --profile test run --build --rm e2e
  e2e:
    profiles: [test]
    build: ./verification
    environment:
      API_URL: http://api:8000
      MAILPIT_URL: http://mailpit:8025
    depends_on:
      api:
        condition: service_healthy
    networks: [app, smtp]

networks:
  app:
    internal: true
  smtp:
    internal: true
  # Publishing the loopback web UI requires a non-internal bridge.
  mailpit-ui: {}
  inference: {}
  laya-engine: {}

volumes:
  deliveries:
  captured-mail:
  ollama-models:
  laya-models:
